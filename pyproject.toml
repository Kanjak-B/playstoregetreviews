[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playstoregetreviews"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["google-play-scraper==1.2.7", "requests==2.32.5", "SQLAlchemy==2.0.44", "pydantic==2.12.3", "Jinja2==3.1.6"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "openai==2.7.1"]
llm = ["openai==2.7.1"]

[project.scripts]
playstoregetreviews = "playstoregetreviews.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
playstoregetreviews = ["templates/*.html"]
